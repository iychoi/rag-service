components:
  schemas:
    BulkIndexOut:
      properties:
        jobs:
          items:
            $ref: '#/components/schemas/JobOut'
          type: array
          title: Jobs
        skipped:
          items:
            additionalProperties:
              type: string
            type: object
          type: array
          title: Skipped
          description: Documents not indexed, as {document_id, reason} where reason is an error code
      type: object
      required:
      - jobs
      - skipped
      title: BulkIndexOut
    BulkIndexRequest:
      properties:
        parser:
          type: string
          title: Parser
          description: docling or mineru (.md/.markdown/.txt always use passthrough)
          default: docling
        options:
          additionalProperties: true
          type: object
          title: Options
          description: 'Parser options. docling: do_ocr, force_ocr, ocr_engine, ocr_lang, do_table_structure,
            table_mode, pdf_backend, document_timeout. mineru: tier (flash|basic|standard|advanced), ocr_mode
            (auto|txt|ocr), page_range.'
        force_reparse:
          type: boolean
          title: Force Reparse
          description: Ignore the parse cache
          default: false
        scope:
          type: string
          enum:
          - unindexed
          - all
          title: Scope
          description: 'unindexed: documents with status uploaded or failed; all: every document'
          default: unindexed
      additionalProperties: false
      type: object
      title: BulkIndexRequest
      example:
        parser: docling
        scope: unindexed
    DatasetCreate:
      properties:
        name:
          type: string
          maxLength: 255
          minLength: 1
          title: Name
        embedding:
          $ref: '#/components/schemas/EmbeddingConfig'
          description: Embedding model. Cannot be changed later. The base URL is server configuration.
        external_ref:
          type: string
          maxLength: 255
          title: External Ref
          description: Unique identifier from an external system
          nullable: true
        description:
          type: string
          title: Description
          nullable: true
        chunk_size:
          type: integer
          maximum: 8192.0
          minimum: 64.0
          title: Chunk Size
          description: Tokens per chunk; must fit the embedding model's input limit (indexing fails otherwise)
          default: 512
        chunk_overlap:
          type: integer
          maximum: 2048.0
          minimum: 0.0
          title: Chunk Overlap
          description: Must be less than chunk_size
          default: 64
        metadata:
          additionalProperties: true
          type: object
          title: Metadata
          description: 'Keys: ^[A-Za-z][A-Za-z0-9_.-]{0,63}$; scalar values'
      additionalProperties: false
      type: object
      required:
      - name
      - embedding
      title: DatasetCreate
      example:
        chunk_overlap: 64
        chunk_size: 512
        description: Contracts and policies
        embedding:
          model: titan-embed-v2
          provider: litellm
        external_ref: team-legal-001
        metadata:
          team: legal
        name: legal-docs
    DatasetOut:
      properties:
        id:
          type: string
          title: Id
        name:
          type: string
          title: Name
        external_ref:
          type: string
          title: External Ref
          nullable: true
        description:
          type: string
          title: Description
          nullable: true
        embedding:
          $ref: '#/components/schemas/EmbeddingOut'
        chunk_size:
          type: integer
          title: Chunk Size
        chunk_overlap:
          type: integer
          title: Chunk Overlap
        metadata:
          additionalProperties: true
          type: object
          title: Metadata
        created_at:
          type: string
          format: date-time
          title: Created At
        updated_at:
          type: string
          format: date-time
          title: Updated At
        document_counts:
          additionalProperties:
            type: integer
          type: object
          title: Document Counts
          description: Documents per status plus `total`; null in list responses
          nullable: true
      type: object
      required:
      - id
      - name
      - external_ref
      - description
      - embedding
      - chunk_size
      - chunk_overlap
      - metadata
      - created_at
      - updated_at
