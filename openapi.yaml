  /v1/datasets/{dataset_id}/documents/{document_id}/index:
    post:
      tags:
      - indexing
      summary: Index a document
      description: Starts a background job (parse → chunk → embed → store). Re-indexing replaces the document's
        chunks without a gap; if the job fails, the previous chunks stay. Parse results are cached per
        parser and options unless `force_reparse` is true.
      operationId: index_document
      parameters:
      - name: dataset_id
        in: path
        required: true
        schema:
          type: string
          title: Dataset Id
      - name: document_id
        in: path
        required: true
        schema:
          type: string
          title: Document Id
      - name: X-Model-API-Key
        in: header
        required: false
        schema:
          type: string
          description: LiteLLM key for embedding/LLM calls. Required when the dataset's embedding model
            has requires_api_key=true. Never stored.
          title: X-Model-Api-Key
          nullable: true
        description: LiteLLM key for embedding/LLM calls. Required when the dataset's embedding model
          has requires_api_key=true. Never stored.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/IndexRequest'
      responses:
        '202':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/JobOut'
        '400':
          description: 'Bad request. Error codes: `missing_model_api_key`'
          content:
            application/json:
              examples:
                missing_model_api_key:
                  value:
                    error:
                      code: missing_model_api_key
                      message: X-Model-API-Key header is required
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: 'Not found. Error codes: `dataset_not_found`, `document_not_found`'
          content:
            application/json:
              examples:
                dataset_not_found:
                  value:
                    error:
                      code: dataset_not_found
                      message: dataset '52967db904d44a09b33f88b3c9f64a6a' not found
                document_not_found:
                  value:
                    error:
                      code: document_not_found
                      message: document 'bbd713912b614848a8f0def3f73aa304' not found
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: 'Conflict. Error codes: `job_in_progress`'
          content:
            application/json:
              examples:
                job_in_progress:
                  value:
                    error:
                      code: job_in_progress
                      message: document 'bbd713912b614848a8f0def3f73aa304' already has an active indexing
                        job
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '422':
          description: 'Invalid request. Error codes: `validation_error`, `unsupported_parser_or_format`,
            `invalid_parser_options`'
          content:
            application/json:
              examples:
                validation_error:
                  value:
                    error:
                      code: validation_error
                      message: 'query: String should have at least 1 character'
                unsupported_parser_or_format:
                  value:
                    error:
                      code: unsupported_parser_or_format
                      message: parser 'docling' does not support '.exe' files
                invalid_parser_options:
                  value:
                    error:
                      code: invalid_parser_options
                      message: 'unsupported docling options: [''to_formats''] (allowed: [...])'
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '503':
          description: 'Service unavailable. Error codes: `parser_unavailable`, `litellm_not_configured`'
          content:
            application/json:
              examples:
                parser_unavailable:
                  value:
                    error:
                      code: parser_unavailable
                      message: parser 'docling' is unavailable
                litellm_not_configured:
                  value:
                    error:
                      code: litellm_not_configured
                      message: LITELLM_BASE_URL is not configured
              schema:
                $ref: '#/components/schemas/ErrorResponse'
