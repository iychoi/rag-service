# Embedding model catalog
# Datasets pick one of the ids below via `embedding_model_id` at creation time.
# Do not remove or change entries used by existing datasets (verified at server startup).

# Development/tests: local hash embedding without external calls (no semantic search quality)
- id: hash-dev
  provider: hash
  model: hash-ngram-v1
  dim: 512
  max_input_tokens: 8192
  description: "Local n-gram hashing embedding for development and tests"

